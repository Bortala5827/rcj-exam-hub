<style>
:root{
  --primary:#b54846; --primary-dark:#8f3a38; --primary-darker:#6f2d2c;
  --primary-light:#d17a78; --primary-light-blue:#fca5a5;
  --accent:#c75e2e;
  --bg:#f5f6f8; --card:#ffffff; --text:#1a1d23; --text-secondary:#6b7280; --text-muted:#9ca3af;
  --border:#eceef1; --border-light:#f1f5f9; --surface:#ffffff; --surface-2:#f8f9fb;
  --amber:#d97706; --amber-bg:#fff8ec; --green:#2f9e44;
  --shadow-sm:0 1px 2px rgba(16,24,40,.06);
  --shadow:0 4px 16px rgba(16,24,40,.08),0 1px 3px rgba(16,24,40,.05);
  --shadow-lg:0 18px 50px rgba(16,24,40,.14);
  --radius:18px;
}
body.dark{
  --bg:#0e1116; --card:#161b22; --surface:#161b22; --surface-2:#1e2530;
  --text:#e8eaed; --text-secondary:#9aa4b2; --text-muted:#6b7280;
  --border:#262c36; --border-light:#1e2530; --amber-bg:#241c10;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 4px 16px rgba(0,0,0,.35);
  --shadow-lg:0 18px 50px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.75;-webkit-font-smoothing:antialiased;font-size:15px;}
a{color:var(--primary);text-decoration:none;transition:color .15s;}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 64px;}

/* ── Header ── */
.header{background:linear-gradient(135deg,#c0392b 0%,#e0533f 48%,#f0852e 100%);color:#fff;
  padding:46px 16px 30px;text-align:center;position:relative;overflow:visible;border-bottom:3px solid rgba(255,255,255,.28);}
.header::before{content:"";position:absolute;top:-60%;right:-20%;width:70%;height:200%;
  background:radial-gradient(circle,rgba(255,255,255,.2),transparent 60%);pointer-events:none;}
.header::after{content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1px);background-size:22px 22px;opacity:.6;pointer-events:none;}
.header h1{margin:0;font-size:27px;letter-spacing:.5px;font-weight:800;position:relative;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.2);}
.header .subtitle{font-size:14px;opacity:.9;margin-top:6px;position:relative;}
.theme-toggle{position:absolute;top:16px;right:16px;z-index:2;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);color:#fff;
  width:40px;height:40px;border-radius:50%;font-size:17px;cursor:pointer;transition:.2s;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
.theme-toggle:hover{background:rgba(255,255,255,.34);transform:rotate(15deg);}
.hub-btn{position:absolute;top:16px;left:16px;z-index:3;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);color:#fff;font-weight:600;font-size:.82rem;padding:7px 14px;border-radius:999px;transition:.15s;white-space:nowrap;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
.hub-btn:hover{background:rgba(255,255,255,.3);transform:translateY(-1px);}

/* ── Stats ── */
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px;position:relative;}
.stat-card{background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:10px 20px;min-width:84px;transition:.2s;}
.stat-card:hover{background:rgba(255,255,255,.24);transform:translateY(-2px);}
.stat-num{font-size:24px;font-weight:800;line-height:1.1;}
.stat-label{font-size:12px;opacity:.9;margin-top:2px;}
/* 进度条卡片 */
.progress-container{background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:10px 18px;min-width:180px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;}
.progress-text{font-size:11.5px;color:rgba(255,255,255,.92);margin-bottom:5px;font-weight:600;display:flex;justify-content:space-between;width:100%;}
.progress-bar-bg{width:100%;height:7px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden;}
.progress-bar-fill{width:0%;height:100%;background:#4ade80;transition:width .3s ease;border-radius:4px;}

/* ── Toolbar ── */
.toolbar{position:sticky;top:0;z-index:30;background:var(--bg);background:color-mix(in srgb,var(--bg) 82%,transparent);
  -webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);padding:14px 0 10px;border-bottom:1px solid var(--border);margin-bottom:4px;}
.toolbar .tool-panel{max-width:880px;margin:0 auto;padding:0 16px;}
.top-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
.search-wrap{position:relative;flex:1 1 260px;min-width:220px;}
.search-input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:12px;
  font-size:15px;background:var(--card);color:var(--text);box-shadow:var(--shadow-sm);transition:.18s;}
.search-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(181,72,70,.12);}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center;}
.filter-label{font-size:12.5px;color:var(--text-secondary);align-self:center;margin-right:2px;font-weight:600;letter-spacing:.5px;}
.chip{padding:6px 14px;border:1px solid var(--border);border-radius:20px;background:var(--card);
  color:var(--text-secondary);font-size:13px;cursor:pointer;transition:.18s;user-select:none;font-weight:500;white-space:nowrap;}
.chip:hover{border-color:var(--primary);color:var(--primary);}
.chip.active{background:linear-gradient(135deg,var(--primary),var(--primary-dark));border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(181,72,70,.3);}
.action-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.action-btn{padding:9px 14px;border:1px solid var(--border);border-radius:11px;background:var(--card);
  color:var(--text);font-size:13px;cursor:pointer;transition:.18s;font-weight:600;box-shadow:var(--shadow-sm);white-space:nowrap;}
.action-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow);color:var(--primary);}
.action-btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(181,72,70,.28);}
.action-btn.primary:hover{box-shadow:0 10px 24px rgba(181,72,70,.36);}
.result-count{font-size:12px;color:var(--text-muted);margin-left:auto;}
.result-count strong{color:var(--primary);font-weight:700;}
body.dark .result-count strong{color:var(--primary-light-blue);}
/* 折叠工具栏 */
.tool-toggle{display:inline-flex;align-items:center;gap:4px;padding:7px 14px;border-radius:10px;background:var(--primary);color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
.tool-toggle:hover{opacity:.9;}
.tool-collapsed{display:none;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--border-light);align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;}
.toolbar.collapsed .tool-collapsed{display:flex;}
.toolbar.collapsed .tool-panel{display:none;}
.tool-collapsed .truncated-chips{display:flex;gap:4px;flex-wrap:wrap;}
.tool-collapsed .truncated-chips .chip{padding:2px 8px;font-size:11px;font-weight:600;background:rgba(181,72,70,.12);color:var(--primary);border-radius:999px;border:1px solid rgba(181,72,70,.2);}
.tool-collapsed .collapse-toggle{margin-left:auto;}
@media (max-width:640px){.action-btn{padding:8px 12px;font-size:12.5px;}.rcj-brandbar{font-size:12px}.rcj-brandbar .rcj-links a{font-size:13px;padding:6px 14px}}

/* ── 练习录音卡片 ── */
.practice-log-card{margin:14px 0 0;padding:0;border-radius:14px;background:var(--card);border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow-sm)}
.practice-log-head{display:flex;align-items:center;gap:8px;padding:12px 18px;cursor:pointer;user-select:none;border-bottom:1px solid var(--border-light)}
.practice-log-head:hover{background:var(--surface-2);}
.practice-log-title{font-weight:700;font-size:14.5px;color:var(--primary);}
.practice-log-count{font-size:12px;color:var(--text-muted);}
.practice-log-caret{margin-left:auto;transition:transform .2s;color:var(--text-muted);}
.practice-log-card.collapsed .practice-log-caret{transform:rotate(-90deg);}
.practice-log-body{padding:0 14px 14px;max-height:260px;overflow:auto;}
.practice-log-card.collapsed .practice-log-body{display:none;}
.practice-log-empty{font-size:13px;color:var(--text-muted);text-align:center;padding:16px 0;}

/* 练习记录全屏弹窗 */
.voice-log-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:10000;display:none;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .25s ease}
.voice-log-overlay.show{display:flex;opacity:1}
.voice-log-modal{background:var(--card);border-radius:14px;width:100%;max-width:580px;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);transform:translateY(30px) scale(.96);transition:transform .3s ease;border:1px solid var(--border);overflow:hidden}
.voice-log-overlay.show .voice-log-modal{transform:translateY(0) scale(1)}
.voice-log-modal-header{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:14px 14px 0 0;flex-shrink:0}
.voice-log-modal-header h3{margin:0;font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px}
.voice-log-modal-close{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .2s;flex-shrink:0}
.voice-log-modal-close:hover{background:rgba(255,255,255,.3);transform:rotate(90deg)}
.voice-log-modal-body{flex:1;overflow-y:auto;padding:0}
.voice-log-modal-body .practice-log-item{display:block;padding:14px 20px;border-radius:0;border-left:none;border-right:none;border-top:none;border-bottom:1px solid var(--border-light)}
.voice-log-modal-body .practice-log-item:last-child{border-bottom:none}
.voice-log-modal-footer{padding:12px 20px;border-top:1px solid var(--border);flex-shrink:0}
.voice-log-export{background:var(--primary);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;transition:.18s}
.voice-log-export:hover{opacity:.9;transform:translateY(-1px)}
.voice-log-remark{width:100%;margin-top:8px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:12px;resize:vertical;min-height:40px;background:var(--surface-2);color:var(--text);font-family:inherit}
.voice-log-remark:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(181,72,70,.1)}

/* ── List / Cards ── */
#qlist{margin-top:16px;display:flex;flex-direction:column;gap:14px;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm);transition:transform .2s,box-shadow .2s,border-color .2s;}
.q-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:rgba(181,72,70,.22);}
.q-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;cursor:pointer;}
.q-head-left{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
.q-tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.q-num{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;font-size:11.5px;font-weight:700;border-radius:7px;padding:2px 8px;white-space:nowrap;box-shadow:0 2px 6px rgba(181,72,70,.22);line-height:1.4;}
.q-type{font-size:11.5px;color:var(--text);background:#f8f9fb;border:1px solid var(--border);border-radius:7px;padding:2px 9px;white-space:nowrap;font-weight:600;line-height:1.4;}
body.dark .q-type{background:#1e2530;color:#e8eaed;border-color:#262c36;}
.q-meta-inline{font-size:11.5px;color:var(--text-muted);line-height:1.4;}
.q-title{font-size:16px;font-weight:600;margin:0;line-height:1.65;overflow-wrap:break-word;word-break:break-word;color:var(--text);}
.q-toggle{color:var(--text-secondary);font-size:18px;flex-shrink:0;transition:.25s;line-height:1.6;align-self:center;}
.q-card.open .q-toggle{transform:rotate(180deg);color:var(--primary);}
.q-body{max-height:0;overflow:hidden;transition:max-height .35s ease;}
.q-card.open .q-body{max-height:3000px;}
.q-body-inner{padding-top:16px;border-top:1px solid var(--border);margin-top:14px;}
.answer-block{margin-bottom:14px;}
.answer-title{font-weight:800;color:var(--text);font-size:14.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.answer-title::before{content:"";width:4px;height:15px;background:linear-gradient(var(--primary),var(--primary-dark));border-radius:2px;}
.answer-text{font-size:14.5px;white-space:pre-wrap;color:var(--text);overflow-wrap:break-word;word-break:break-word;}
.points-block{background:var(--amber-bg);border:1px solid rgba(217,119,6,.18);border-left:3px solid var(--amber);border-radius:10px;padding:12px 14px;}
.points-title{font-weight:800;color:var(--amber);font-size:13px;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.points-title::before{content:"";width:4px;height:13px;background:var(--amber);border-radius:2px;}
.points-text{font-size:13.5px;color:var(--text);white-space:pre-wrap;line-height:1.7;overflow-wrap:break-word;word-break:break-word;}
.sec-h{display:block;font-weight:800;color:var(--amber);font-size:14px;margin:14px 0 6px;padding-left:11px;border-left:3px solid var(--amber);letter-spacing:.3px;}
.sec-h:first-child{margin-top:2px;}
.pt{font-weight:800;color:var(--amber);font-size:15px;padding-right:2px;}
.empty{padding:54px 20px;text-align:center;color:var(--text-secondary);}

/* ── Random Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(15,18,22,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal-overlay.show{display:flex;animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:22px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:var(--shadow-lg);border:1px solid var(--border);animation:popIn .25s cubic-bezier(.2,.8,.3,1.2);}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,rgba(16,24,40,.04),transparent);}
.modal-head h3{margin:0;font-size:18px;color:var(--primary);font-weight:800;}
.modal-close{background:var(--bg);border:none;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--text-secondary);transition:.15s;}
.modal-close:hover{background:var(--primary);color:#fff;transform:rotate(90deg);}
.modal-body{padding:20px 22px;}
.timer-box{border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:16px;background:var(--surface-2);}
.timer-header{display:flex;justify-content:space-between;font-size:14px;font-weight:600;align-items:center;}
.timer-right{display:flex;align-items:center;gap:8px;}
.timer-digits{color:var(--primary);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;}
.timer-reset-btn{font-size:12px;font-weight:600;color:var(--primary);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:3px 10px;cursor:pointer;transition:all .15s;}
.timer-reset-btn:hover{border-color:var(--primary);background:rgba(181,72,70,.08);}
.timer-bar{height:7px;background:var(--border);border-radius:6px;margin-top:10px;overflow:hidden;}
.timer-bar-fill{height:100%;width:100%;background:linear-gradient(90deg,#fab005,var(--accent));transition:width 1s linear;}
.timer-bar-fill.warning{background:#ef4444;}
.timer-duration-row{display:flex;align-items:center;gap:10px;margin-top:9px;min-height:32px;}
.timer-duration-label{font-size:12.5px;font-weight:700;color:var(--text-secondary);white-space:nowrap;}
.timer-duration-btns{display:inline-flex;gap:6px;}
.dur-btn{font-size:12px;font-weight:700;color:var(--text-secondary);background:var(--card);border:1.5px solid var(--border);border-radius:999px;padding:4px 13px;cursor:pointer;transition:all .15s;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.dur-btn:hover{color:var(--primary);border-color:var(--primary);background:rgba(181,72,70,.08);}
.dur-btn.active{color:#fff !important;background:linear-gradient(135deg,var(--primary),var(--primary-dark)) !important;border-color:var(--primary) !important;}
.rec-zone{border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;background:var(--surface-2);text-align:center;}
.rec-bar{display:flex;align-items:center;justify-content:center;gap:12px;}
.record-btn{padding:12px 20px;border:none;border-radius:12px;font-size:15px;cursor:pointer;background:#94a3b8;color:#fff;font-weight:700;transition:.18s;box-shadow:var(--shadow-sm);}
.record-btn.idle{background:linear-gradient(135deg,var(--primary),var(--primary-dark));box-shadow:0 6px 16px rgba(181,72,70,.28);}
.record-btn.idle:hover{transform:translateY(-1px);}
.record-btn.recording{background:linear-gradient(135deg,var(--accent),#b54d22);animation:pulse 1.3s infinite;box-shadow:0 6px 18px rgba(199,94,46,.35);}
@keyframes pulse{0%{opacity:1}50%{opacity:.65}100%{opacity:1}}
.rec-timer{font-variant-numeric:tabular-nums;font-size:15px;color:var(--text-secondary);letter-spacing:.04em;min-width:48px;}
.rec-bar.recording .rec-timer{color:var(--accent);font-weight:700;}
.local-audio{width:100%;margin-top:12px;border-radius:8px;}
.transcript-box{margin-top:12px;text-align:left;}
.transcript-title{font-size:13px;font-weight:700;margin-bottom:6px;color:var(--text);}
.transcript-content{font-size:13.5px;min-height:40px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;white-space:pre-wrap;line-height:1.7;}
.transcript-note{font-size:12px;color:var(--text-muted);margin-top:6px;}
.dl-btn{margin-top:10px;padding:8px 16px;border:1px solid var(--primary);color:var(--primary);background:var(--card);border-radius:10px;font-size:13px;cursor:pointer;font-weight:600;transition:.15s;}
.dl-btn:hover{background:rgba(181,72,70,.06);}
.voice-saved-hint{display:none;margin-top:8px;padding:8px 12px;border-radius:8px;background:rgba(47,158,68,.1);border:1px solid rgba(47,158,68,.25);color:#047857;font-size:12px;}
.voice-saved-hint.show{display:block;}
.q-text{font-size:16.5px;font-weight:700;margin:8px 0 14px;line-height:1.7;color:var(--text);}
.reveal-btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:none;border-radius:12px;font-size:15px;cursor:pointer;font-weight:700;box-shadow:0 6px 16px rgba(181,72,70,.28);transition:.18s;}
.reveal-btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(181,72,70,.38);}
.answer-reveal{margin-top:16px;border-top:1px dashed var(--border);padding-top:16px;}
.modal-foot{display:flex;gap:10px;padding:16px 22px;border-top:1px solid var(--border);}
.modal-foot .action-btn{flex:1;text-align:center;}

/* ── 计时器 ── */
.settings-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.settings-overlay.show{display:flex;}
.settings-modal{background:var(--card);border-radius:18px;max-width:440px;width:100%;padding:24px;box-shadow:var(--shadow-lg);max-height:88vh;overflow:auto;border:1px solid var(--border);}
.settings-title{font-size:17px;font-weight:800;margin:0 0 4px;color:var(--text);}
.settings-sub{font-size:12.5px;color:var(--text-secondary);margin:0 0 16px;line-height:1.65;}
.settings-section{border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden;background:var(--surface-2);}
.settings-section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:11px 14px;background:var(--surface-2);border:none;cursor:pointer;font:inherit;font-size:14px;font-weight:700;color:var(--text);text-align:left;}
.settings-section-head:hover{background:var(--surface);}
.settings-caret{font-size:11px;opacity:.6;transition:transform .2s;}
.settings-section[data-open="true"] .settings-caret{transform:rotate(180deg);}
.settings-section[data-open="false"] .settings-section-body{display:none;}
.settings-section-body{padding:14px 14px 6px;}
.settings-actions{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0;}
.settings-actions .action-btn{padding:7px 14px;font-size:12.5px;}
.settings-hint{font-size:12px;color:var(--text-muted);line-height:1.6;margin-top:10px;border-top:1px dashed var(--border);padding-top:10px;}
.settings-hint a{color:var(--primary);font-weight:700;}
.settings-actions-row{display:flex;justify-content:flex-end;gap:10px;margin-top:12px;}

/* ── 回到顶部 ── */
.back-to-top{position:fixed;bottom:28px;right:28px;z-index:80;width:44px;height:44px;border-radius:50%;
  background:var(--primary);color:#fff;border:none;cursor:pointer;font-size:18px;box-shadow:var(--shadow-lg);
  opacity:0;visibility:hidden;transform:translateY(20px);transition:all .3s ease;display:flex;align-items:center;justify-content:center;}
.back-to-top.show{opacity:1;visibility:visible;transform:translateY(0);}
.back-to-top:hover{transform:scale(1.1);background:var(--primary-dark);}
body.dark .back-to-top{background:var(--primary-light-blue);color:var(--bg);}

/* ── Toast ── */
.rcj-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(17,24,39,.92);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:99999;max-width:90vw;line-height:1.6;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.3);display:none;}

/* ── Brandbar ── */
.rcj-brandbar{text-align:center;padding:28px 20px;margin-top:40px;border-top:1px solid var(--border);color:var(--text-muted);font-size:13px;background:transparent}
.rcj-brandbar .rcj-links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:0 0 10px}
.rcj-brandbar .rcj-links a{display:inline-flex;align-items:center;justify-content:center;padding:8px 18px;border-radius:999px;color:#fff;text-decoration:none;font-weight:600;font-size:14px;transition:transform .15s ease,box-shadow .15s ease}
.rcj-brandbar .rcj-links a:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.18);text-decoration:none}
.rcj-brandbar .rcj-links a.exam-hub{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);box-shadow:0 4px 12px rgba(79,70,229,.32);font-size:14.5px;}
.rcj-brandbar .rcj-links a.exam-hub:hover{box-shadow:0 6px 18px rgba(79,70,229,.45);}
.youknow-link{text-decoration:none;background:linear-gradient(135deg,#fef3c7,#fde68a);color:#92400e;border-color:#fde68a;font-weight:600}
.youknow-link:hover{background:linear-gradient(135deg,#fde68a,#fcd34d);color:#78350f;border-color:#f59e0b;transform:translateY(-1px)}
.rcj-brandbar .rcj-slogan{margin:0;opacity:.85;word-break:break-word;overflow-wrap:break-word}
.rcj-brandbar .rcj-slogan a{word-break:break-all}
@media(max-width:560px){.header h1{font-size:21px;}.q-title{font-size:15.5px;}.q-card{padding:14px 15px;}.stat-card{min-width:70px;padding:8px 14px;}.hub-btn .hub-txt{display:none;}.hub-btn{right:64px;padding:7px 10px;}.progress-container{min-width:140px;}}

<script>
(function(){
  "use strict";/* ========== 通用工具 ========== */
  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; });
  }
  function toast(msg){
    var t = document.getElementById("rcjToast");
    if (!t) return;
    t.textContent = msg; t.style.display = "block";
    clearTimeout(t._t); t._t = setTimeout(function(){ t.style.display = "none"; }, 3600);
  }
  function fmtDurMs(ms){ var s=Math.round(ms/1000); return (s<60?s+'s':(Math.floor(s/60)+'分'+(s%60||'')+'秒')); }/* ========== 题库数据 ========== */
  var DATA_INTERVIEW = (window.DATA_INTERVIEW || []);
  var DATA_ZHUANZHI = (window.DATA_ZHUANZHI || []);
  DATA_INTERVIEW.forEach(function(q){ if (!q.cat) q.cat = "国家队消防员"; });
  DATA_ZHUANZHI.forEach(function(q){ q.cat = "专职·面试"; });
  var DATA = DATA_INTERVIEW.concat(DATA_ZHUANZHI);/* ========== 统计 + 进度 ========== */
  var years = {}, types = {}, cats = {};
  DATA.forEach(function(q){ if (q.year) years[q.year] = 1; types[q.type] = 1; cats[q.cat] = 1; });
  var totalQ = DATA.length;document.getElementById("statTotal").textContent = totalQ;
  document.getElementById("statYears").textContent = Object.keys(years).length;
  document.getElementById("statTypes").textContent = Object.keys(types).length;// 进度：localStorage 记录已浏览过的题目 id
  var PROGRESS_KEY = 'xf_progress_v2';
  var MASTERED_KEY = 'xf_mastered_v2';
  var browsed = new Set();
  try { browsed = new Set(JSON.parse(localStorage.getItem(PROGRESS_KEY) || '[]')); } catch(e){}
  function updateProgress(){
    var pct = totalQ ? Math.round(browsed.size / totalQ * 100) : 0;
    document.getElementById("progressPercent").textContent = pct + '%';
    document.getElementById("progressBar").style.width = pct + '%';
  }
  function markBrowsed(id){ browsed.add(id); try{localStorage.setItem(PROGRESS_KEY, JSON.stringify([...browsed]));}catch(e){} updateProgress(); }updateProgress();/* ========== 筛选状态 ========== */
  var state = { cat: "all", type: "all", kw: "" };

  function buildChips(rowId, values, key){
    var row = document.getElementById(rowId);
    var all = document.createElement("span");
    all.className = "chip active"; all.textContent = "全部"; all.dataset.v = "all";
    row.appendChild(all);
    values.forEach(function(v){
      var c = document.createElement("span");
      c.className = "chip"; c.textContent = v; c.dataset.v = v;
      row.appendChild(c);
    });
    row.addEventListener("click", function(e){
      var t = e.target;
      if (t.classList.contains("chip")){
        row.querySelectorAll(".chip").forEach(function(x){ x.classList.remove("active"); });
        t.classList.add("active");
        state[key] = t.dataset.v;
        render();
        updateTruncatedChips();
      }
    });
  }
  var CAT_ORDER = ["国家队消防员", "专职·面试"];buildChips("catRow", CAT_ORDER.filter(function(c){ return cats[c]; }), "cat");
  buildChips("typeRow", Object.keys(types), "type");document.getElementById("searchInput").addEventListener("input", function(e){
    state.kw = e.target.value.trim().toLowerCase();
    render();
    updateTruncatedChips();
  });

  function updateResultCount(n){
    var el = document.getElementById("resultCount");
    if (!el) return;
    el.innerHTML = '共 <strong>' + n + '</strong> 题';
  }

  function updateTruncatedChips(){
    var t = document.getElementById("truncatedChips");
    if (!t) return;
    var active = [];
    document.querySelectorAll("#catRow .chip.active, #typeRow .chip.active").forEach(function(c){
      var v = c.textContent.trim();
      if (v !== "全部") active.push(v);
    });
    t.innerHTML = active.length ? active.slice(0,3).map(function(n){return '<span class="chip">'+n+'</span>';}).join('') : '<span style="color:#9ca3af;font-size:12px;">无筛选</span>';
  }

  /* ========== 渲染 ========== */
  function match(q){
    if (state.cat !== "all" && q.cat !== state.cat) return false;
    if (state.type !== "all" && q.type !== state.type) return false;
    if (state.kw){
      var hay = (q.title + " " + q.answer + " " + q.points + " " + q.type).toLowerCase();
      if (hay.indexOf(state.kw) < 0) return false;
    }
    return true;
  }

  function formatAnswer(s){
    var h = escapeHtml(s || "");
    h = h.replace(/【([^】]+)】/g, '<span class="sec-h">【$1】</span>');
    h = h.replace(/([])/g, '<span class="pt">$1</span>');
    return h;
  }
  function buildMeta(q){
    var parts = [];
    if (q.cat) parts.push(q.cat);
    if (q.year) parts.push(q.year + "年");
    if (q.date) parts.push(q.date.slice(5));
    if (q.session) parts.push(q.session + "场");
    if (q.num) parts.push("第" + q.num + "题");
    return escapeHtml(parts.join(" · "));
  }
  function cardHTML(q, idx){
    var metaInline = buildMetaShort(q);
    return '<div class="q-card" data-id="'+escapeHtml(q.id)+'">'+
      '<div class="q-head">'+
        '<div class="q-head-left">'+
          '<div class="q-tags">'+
            '<span class="q-num">#'+(idx+1)+'</span>'+
            '<span class="q-type">'+escapeHtml(q.type)+'</span>'+
            (metaInline ? '<span class="q-meta-inline">'+metaInline+'</span>' : '')+
          '</div>'+
          '<p class="q-title">'+escapeHtml(q.title)+'</p>'+
        '</div>'+
        '<span class="q-toggle"></span>'+
      '</div>'+
      '<div class="q-body"><div class="q-body-inner">'+
        '<div class="answer-block"><div class="answer-title"> 参考答案</div>'+
          '<div class="answer-text">'+formatAnswer(q.answer)+'</div></div>'+
        '<div class="points-block"><div class="points-title"> 答题要点</div>'+
          '<div class="points-text">'+formatAnswer(q.points)+'</div></div>'+
      '</div></div>'+
    '</div>';
  }

  function buildMetaShort(q){
    var parts = [];
    if (q.cat && q.cat !== "专职·面试") parts.push(q.cat);
    if (q.year) parts.push(q.year + "年");
    if (q.date) parts.push(q.date.slice(5));
    if (q.session) parts.push(q.session);
    if (q.num) parts.push("第" + q.num + "题");
    return escapeHtml(parts.join(" · "));
  }

  function render(){
    var list = DATA.filter(match);
    var box = document.getElementById("qlist");
    if (!list.length){ box.innerHTML = '<div class="empty">没有匹配的真题，换个筛选条件试试。</div>'; updateResultCount(0); return; }
    list = list.slice().sort(function(a,b){
      var da = a.date || "", db = b.date || "";
      if (da !== db) return da < db ? 1 : -1;
      var na = a.num || 0, nb = b.num || 0;
      if (na !== nb) return na - nb;
      return (a.id || "") < (b.id || "") ? -1 : 1;
    });
    box.innerHTML = list.map(cardHTML).join("");
    box.querySelectorAll(".q-card").forEach(function(card){
      card.querySelector(".q-head").addEventListener("click", function(){
        card.classList.toggle("open");
        var id = card.dataset.id;
        if (card.classList.contains("open") && id) markBrowsed(id);
      });
    });
    updateResultCount(list.length);
  }
  render();/* ========== 只看未做（按钮已移除，保留逻辑备用） ========== */
  var markMode = false;
  var markModeBtn = document.getElementById("markModeBtn");
  if (markModeBtn) {
    markModeBtn.addEventListener("click", function(){
      markMode = !markMode;
      this.textContent = markMode ? " 显示全部" : " 只看未做";
      document.querySelectorAll(".q-card").forEach(function(c){
        var id = c.dataset.id;
        if (markMode && id && browsed.has(id)) { c.style.display = "none"; }
        else { c.style.display = ""; }
      });
    });
  }

  /* ========== 工具栏折叠 ========== */
  var toolbar = document.getElementById("toolbar");
  var collapseToolBtn = document.getElementById("collapseTool");
  var expandToolBtn = document.getElementById("expandTool");
  function collapseToolbar(){
    if (!toolbar) return;
    toolbar.classList.add("collapsed");
    updateTruncatedChips();
    try { sessionStorage.setItem("xf_toolCollapsed", "1"); } catch(e){}
  }
  function expandToolbar(){
    if (!toolbar) return;
    toolbar.classList.remove("collapsed");
    try { sessionStorage.removeItem("xf_toolCollapsed"); } catch(e){}
  }
  if (collapseToolBtn) collapseToolBtn.addEventListener("click", collapseToolbar);
  if (expandToolBtn) expandToolBtn.addEventListener("click", expandToolbar);
  try { if (sessionStorage.getItem("xf_toolCollapsed") === "1") collapseToolbar(); } catch(e){}

  /* ========== 深色模式 ========== */
  var tt = document.getElementById("themeToggle");
  if (localStorage.getItem("xf_dark") === "1"){ document.body.classList.add("dark"); tt.textContent = ""; }
  tt.addEventListener("click", function(){
    document.body.classList.toggle("dark");
    var on = document.body.classList.contains("dark");
    localStorage.setItem("xf_dark", on ? "1" : "0");
    tt.textContent = on ? "" : "";
  });

  /* ========== 回到顶部 ========== */
  var backToTop = document.getElementById("backToTop");
  window.addEventListener("scroll", function(){
    backToTop.classList.toggle("show", window.scrollY > 400);
  }, {passive:true});
  backToTop.addEventListener("click", function(){ window.scrollTo({top:0, behavior:'smooth'}); });

  /* ========== 录音 + 练习日志（IndexedDB） ========== */
  var DB_NAME = 'xf_voice_db_v2';
  var STORE_NAME = 'recordings';
  var DB_VERSION = 1;
  var db = null;

  function openDB(){
    return new Promise(function(resolve, reject){
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function(e){
        var d = e.target.result;
        if (!d.objectStoreNames.contains(STORE_NAME)){
          d.createObjectStore(STORE_NAME, { keyPath: 'id' });
        }
      };
      req.onsuccess = function(e){ db = e.target.result; resolve(db); };
      req.onerror = function(e){ reject(e.target.error); };
    });
  }

  function dbAdd(item){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(STORE_NAME, 'readwrite');
      var store = tx.objectStore(STORE_NAME);
      store.put(item);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(e){ reject(e.target.error); };
    });
  }

  function dbGetAll(){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(STORE_NAME, 'readonly');
      var store = tx.objectStore(STORE_NAME);
      var req = store.getAll();
      req.onsuccess = function(e){ resolve(e.target.result || []); };
      req.onerror = function(e){ reject(e.target.error); };
    });
  }

  function dbDelete(id){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(STORE_NAME, 'readwrite');
      var store = tx.objectStore(STORE_NAME);
      store.delete(id);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(e){ reject(e.target.error); };
    });
  }

  function dbUpdateNote(id, note){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(STORE_NAME, 'readwrite');
      var store = tx.objectStore(STORE_NAME);
      var req = store.get(id);
      req.onsuccess = function(){
        var item = req.result;
        if (item){ item.note = note; store.put(item); }
      };
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(e){ reject(e.target.error); };
    });
  }

  var modal = document.getElementById("randomModal");var recordBtn = document.getElementById("recordBtn");
  var localAudio = document.getElementById("localAudio");
  var transcriptContent = document.getElementById("transcriptContent") || { textContent: "" };
  var transcriptNote = document.getElementById("transcriptNote") || { textContent: "" };
  var dlBtn = document.getElementById("dlBtn");
  var timerDigits = document.getElementById("timerDigits");
  var timerBarFill = document.getElementById("timerBarFill");
  var voiceSavedHint = document.getElementById("voiceSavedHint");
  var recTimer = document.getElementById("recTimer");
  var recOrb = null, recTimerId = null, recStartTs = 0;
  var TOTAL_SEC = 180;
  var timerId = null, remain = TOTAL_SEC;
  var lastBlobUrl = null, lastBlob = null;
  var currentQuestion = null;
  var SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  var speechRecognizer = null, finalTranscript = "";
  var audioCtx = null, micStream = null, scriptNode = null, gainNode = null, mp3Encoder = null, mp3Chunks = [];
  var isRecording = false;

  function floatTo16(input){
    var out = new Int16Array(input.length);
    for (var k = 0; k < input.length; k++){
      var s = Math.max(-1, Math.min(1, input[k]));
      out[k] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    return out;
  }

  function initSpeechRecognizer(){
    return null; // 语音转文字功能已移除，仅保留录音
    if (!SpeechRecognitionImpl){
      transcriptNote.textContent = "当前浏览器不支持语音转文字（常见于 iOS Safari / 微信内置浏览器），仅保留录音回听功能";
      return null;
    }
    var rec = new SpeechRecognitionImpl();
    rec.lang = "zh-CN"; rec.interimResults = true; rec.continuous = true;
    rec.onresult = function(ev){
      var interim = "";
      for (var i = ev.resultIndex; i < ev.results.length; i++){
        var r = ev.results[i];
        if (r.isFinal) finalTranscript += r[0].transcript; else interim += r[0].transcript;
      }
      transcriptContent.textContent = finalTranscript + interim;
    };
    rec.onerror = function(e){
      if (e.error === "network") transcriptNote.textContent = " 网络无法连接语音识别服务，文字转写暂不可用，但录音回听不受影响";
      else if (e.error === "no-speech") transcriptNote.textContent = "";
      else transcriptNote.textContent = " 语音转文字暂时出错（" + e.error + "），不影响录音回听";
    };
    rec.onend = function(){
      if (isRecording){ try { rec.start(); } catch(e){} }
    };
    return rec;
  }

  function resetTimer(){
    if (timerId) clearInterval(timerId);
    remain = TOTAL_SEC;
    timerDigits.textContent = "03:00";
    timerBarFill.style.width = "100%";
    timerBarFill.classList.remove("warning");
    timerId = setInterval(function(){
      remain--;
      if (remain < 0) remain = 0;
      var m = Math.floor(remain/60), s = remain%60;
      timerDigits.textContent = (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
      timerBarFill.style.width = (remain/TOTAL_SEC*100) + "%";
      if (remain <= 30 && !timerBarFill.classList.contains("warning")) timerBarFill.classList.add("warning");
      if (remain <= 0){
        clearInterval(timerId); timerId = null;
        transcriptNote.textContent = " 规定时间已到，仍可继续录音，结束后点「停止」";
      }
    }, 1000);
  }

  function finishRecording(){
    isRecording = false;
    if (recOrb){ try { recOrb.stop(); } catch(e){} recOrb = null; }
    if (recTimerId){ clearInterval(recTimerId); recTimerId = null; }
    recTimer.textContent = "00:00";
    if (scriptNode){ try { scriptNode.disconnect(); } catch(e){} scriptNode = null; }
    if (gainNode){ try { gainNode.disconnect(); } catch(e){} gainNode = null; }
    if (micStream){ micStream.getTracks().forEach(function(t){ t.stop(); }); micStream = null; }
    if (audioCtx){ try { audioCtx.close(); } catch(e){} audioCtx = null; }
    if (mp3Encoder){
      try { var tail = mp3Encoder.flush(); if (tail.length > 0) mp3Chunks.push(new Int8Array(tail)); } catch(e){}
      mp3Encoder = null;
    }
    var blob = new Blob(mp3Chunks, { type: "audio/mpeg" });
    mp3Chunks = [];
    if (blob.size > 0){
      if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
      lastBlob = blob; lastBlobUrl = URL.createObjectURL(blob);
      localAudio.src = lastBlobUrl; localAudio.style.display = "block";
      dlBtn.style.display = "inline-block";
    }
    if (speechRecognizer){ try { speechRecognizer.onend = null; speechRecognizer.stop(); } catch(e){} }
    recordBtn.textContent = " 开始录音";
    recordBtn.className = "record-btn idle";
  }

  function stopRecording(){ finishRecording(); }

  recordBtn.addEventListener("click", function(){
    if (isRecording){ stopRecording(); saveRecording(); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      toast("当前环境不支持录音（需 HTTPS 或 localhost，并授予麦克风权限）。"); return;
    }
    if (!window.lamejs || !window.lamejs.Mp3Encoder){
      toast("MP3 编码器未就绪，请刷新页面后重试。"); return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
      if (audioCtx.state === "suspended"){ try { audioCtx.resume(); } catch(e){} }
      micStream = stream;
      var sr = audioCtx.sampleRate;
      mp3Encoder = new window.lamejs.Mp3Encoder(1, sr, 128);
      mp3Chunks = [];
      var source = audioCtx.createMediaStreamSource(stream);
      var analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      source.connect(analyser);
      scriptNode = audioCtx.createScriptProcessor(4096, 1, 1);
      scriptNode.onaudioprocess = function(e){
        if (!isRecording) return;
        var samples = e.inputBuffer.getChannelData(0);
        try { var buf = mp3Encoder.encodeBuffer(floatTo16(samples)); if (buf.length > 0) mp3Chunks.push(new Int8Array(buf)); } catch(err){}
      };
      gainNode = audioCtx.createGain(); gainNode.gain.value = 0;
      source.connect(scriptNode); scriptNode.connect(gainNode); gainNode.connect(audioCtx.destination);
      isRecording = true;
      finalTranscript = ""; transcriptContent.textContent = "";
      recordBtn.textContent = " 停止录音";
      recordBtn.className = "record-btn recording";
      voiceSavedHint.classList.remove("show");
      recStartTs = Date.now();
      recTimerId = setInterval(function(){
        var s = Math.floor((Date.now() - recStartTs) / 1000);
        recTimer.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
      }, 500);
      speechRecognizer = initSpeechRecognizer();
      if (speechRecognizer){ try { speechRecognizer.start(); } catch(e){} }
    }).catch(function(){
      toast("麦克风调用失败！请确保已授予麦克风权限。");
    });
  });

  function saveRecording(){

  /* 计时时长按钮 */
  document.getElementById("timerDurationBtns").addEventListener("click", function(e){
