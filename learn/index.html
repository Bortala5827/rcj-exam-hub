<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>你懂的 · 体制经济历史知识卡 | 像刷小红书一样刷知识</title>
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://exam.955827.xyz/learn/" />
  <meta name="description" content="你懂的：把复杂现实压成一张能刷的关系卡。考公、编制、城市、财政、房价、历史、世界，一张图看懂。像刷小红书一样刷知识。">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-title" content="你懂的">
  <meta name="application-name" content="你懂的">
  <meta name="og:title" content="你懂的 · 刷一张知识，看懂一张关系">
  <meta name="og:description" content="把复杂现实压成一张能刷的关系卡。考公、编制、城市、财政、房价、历史、世界，一张图看懂。">
  <link rel="stylesheet" href="learn.css?v=20260829a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='system-ui' font-size='30' font-weight='800' fill='white'%3EL%3C/text%3E%3C/svg%3E">
</head>
<body>

  <div class="ln-bar">
    <div class="ln-actions">
      <button class="ln-btn on" id="btnSwipe" title="牌堆式横向刷">牌堆</button>
      <button class="ln-btn" id="btnFeed" title="像刷小红书一样纵向刷">瀑布流</button>
      <button class="ln-btn" id="btnMy" title="我收藏的卡片">我的</button>
    </div>
    <button class="ln-btn home-top" id="homeMini" title="回到 Exam 首页">首页</button>
  </div>

  <!-- 牌堆视图 -->
  <div id="swipeView">
    <div class="ln-stage">
      <div class="ln-progress-wrap">
        <div class="ln-progress-bar"><div class="ln-progress-fill" id="progressFill"></div></div>
        <div class="ln-progress-text" id="progressText">已看 0 / 0</div>
      </div>
      <div id="deck"></div>
    </div>
  </div>

  <!-- 瀑布流视图 -->
  <div id="feedView" class="hidden">
    <div class="ln-stage feed-stage">
      <div class="feed-filter" id="feedFilter" role="tablist" aria-label="瀑布流筛选"></div>
      <div class="feed-grid" id="feedGrid"></div>
      <div class="feed-end" id="feedEnd"></div>
    </div>
  </div>

  <!-- 我的知识视图 -->
  <div id="myView" class="hidden">
    <div class="ln-stage ln-stage--my"></div>
  </div>

  <!-- 详情 modal：瀑布流卡片点开后展开完整知识图谱 -->
  <div id="detailModal" class="hidden" role="dialog" aria-modal="true" aria-label="卡片详情">
    <div class="detail-overlay" id="detailOverlay"></div>
    <div class="detail-panel">
      <button class="detail-close" id="detailClose" aria-label="关闭详情">×</button>
      <button class="detail-ai" id="detailAiRelate" type="button" title="围绕这张卡，用 AI 发散聚合：关联点 / 引导式提问 / 关联讲解">AI 关联</button>
      <div id="detailBody"></div>
      <div class="detail-foot">
        <button class="ln-btn ln-btn-fav" id="detailFav"><span class="ln-btn-ico"></span><span class="ln-btn-txt">收藏</span></button>
        <button class="ln-btn detail-go-swipe" id="detailGoSwipe">在牌堆里刷 </button>
      </div>
    </div>
  </div>

  <!-- 底部操作条（仅牌堆视图可见） -->
  <div class="ln-foot" id="foot">
    <button class="act prev" id="actPrev">上一张</button>
    <button class="act fav" id="actFav" aria-pressed="false" title="收藏"></button>
    <button class="act seen" id="actSeen">下一张</button>
  </div>

  <!-- ========== 悬浮 AI 助手 ========== -->
  <button class="ai-fab" id="aiFab" type="button" aria-label="打开 AI 助手" title="AI 助手：围绕当前卡片发散 / 提问">AI</button>
  <div class="ai-assist hidden" id="aiAssist" role="dialog" aria-label="AI 助手">
    <section class="ai-relate" id="aiRelate">
      <div class="ai-relate-head">
        <span class="ai-assist-title">AI 助手</span>
        <span class="ai-relate-sub" id="aiRelateSub"></span>
        <span class="ai-relate-acts">
          <button class="ai-mini" id="aiRelateRegenerate" type="button" title="忽略缓存，重新生成一批关联点">换一批</button>
          <button class="ai-mini" id="aiRelateCopy" type="button" title="复制全部关联点到剪贴板">复制</button>
          <button class="ai-mini" id="aiAssistClose" type="button" title="收起 AI 助手"></button>
        </span>
      </div>
      <div class="ai-relate-pick">
        <span class="ai-pick-label">模型</span>
        <label class="ai-pick"><input type="radio" name="aiProvider" value="dots"> 小红书 dots</label>
        <label class="ai-pick"><input type="radio" name="aiProvider" value="agnes"> Agnes</label>
        <label class="ai-pick"><input type="radio" name="aiProvider" value="sensenova"> SenseNova</label>
        <label class="ai-pick"><input type="radio" name="aiProvider" value="bai"> b.ai</label>
        <label class="ai-pick"><input type="radio" name="aiProvider" value="groq"> Groq</label>
        <label class="ai-pick"><input type="radio" name="aiProvider" value="custom"> 自定义</label>
      </div>
      <div class="ai-custom-row" id="aiCustomRow" hidden>
        <div class="ai-custom-inputs">
          <input type="text" id="aiBase" placeholder="接口地址 https://.../v1" autocomplete="off">
          <div class="ai-custom-row2">
            <input type="text" id="aiModelName" placeholder="模型名" autocomplete="off">
            <input type="password" id="aiCustomKey" placeholder="API Key" autocomplete="off">
            <button type="button" class="ai-key-toggle" id="aiKeyToggle" title="显示/隐藏 API Key"></button>
          </div>
        </div>
        <div class="ai-probe-row">
          <button class="ai-probe-btn" id="aiProbeBtn" type="button">测试连通性</button>
          <span class="ai-probe-res" id="aiProbeRes"></span>
        </div>
      </div>
      <p class="ai-relate-custom-tip" id="aiCustomTip" hidden>选了「自定义」但还没填模型。在上方填接口地址 / 模型名 / API Key 并点「测试连通性」验证，或切回 dots / Agnes / SenseNova / b.ai / Groq 免费用。</p>
      <p class="ai-relate-hint">围绕这张卡，AI 会发散聚合：几个关联点、引导提问，或直接一段关联讲解。也可以在下方输入框里追问。</p>
      <div class="ai-relate-loading" id="aiRelateLoading" hidden>
        <span class="ai-relate-spinner"></span> 正在生成关联…
      </div>
      <ul class="ai-relate-list" id="aiRelateList"></ul>
      <div class="ai-relate-follow" id="aiRelateFollow" hidden></div>
      <div class="ai-relate-src" id="aiRelateSources" hidden></div>
      <div class="ai-assist-input">
        <input id="aiAssistInput" type="text" placeholder="追问：用大白话解释 / 出一道变式题…" maxlength="120" autocomplete="off">
        <button class="ai-send" id="aiAssistSend" type="button" title="发送提问"></button>
      </div>
    </section>
  </div>

  <script src="cards.js?v=20260828b"></script>
  <script src="learn.js?v=20260829a"></script>
</body>
</html>
